// ============================================================================
// CARGA
// ============================================================================
function setStatus(estado, texto){
  var d=document.getElementById('st-dot');
  d.className='dot'+(estado?' '+estado:'');
  document.getElementById('st-tx').textContent=texto;
}
function setBotao(carregando){
  var b=document.getElementById('btn-load');
  b.disabled=carregando;
  document.getElementById('btn-ic').textContent=carregando?'⟳':'↻';
  document.getElementById('btn-tx').textContent=carregando?'Buscando…':'Buscar dados';
}
function esperar(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

// Ordem de busca: primeiro o bloco novo, depois a era anterior do mais recente
// para o mais antigo. Assim o painel já mostra algo útil no primeiro lote.
function filaDeDatas(){
  var novo = BLOCOS.novo.jogos.map(function(g){ return g.data; });
  var resto = CONTEXTO.filter(function(g){ return novo.indexOf(g.data)<0; })
    .sort(function(a,b){ return chaveData(b.data).localeCompare(chaveData(a.data)); })
    .map(function(g){ return g.data; });
  return novo.concat(resto);
}

async function carregar(){
  if(DEMO){ DEMO=false; DADOS={}; EXTRAS={}; SEM_POSICAO={}; CARREGADO=false;
    document.getElementById('demo-bar').style.display='none'; }
  setBotao(true);
  var fila=filaDeDatas(), lotes=[];
  for(var i=0;i<fila.length;i+=LOTE) lotes.push(fila.slice(i,i+LOTE));
  var falhas=[], ok=0;

  for(var L=0;L<lotes.length;L++){
    setStatus('load','Lote '+(L+1)+' de '+lotes.length+' · '+ok+' jogos carregados');
    try{
      var url = BACKEND+'/api/comparativo?datas='+encodeURIComponent(lotes[L].join(','));
      var r = await fetch(url);
      if(!r.ok){
        var e = await r.json().catch(function(){ return {error:'HTTP '+r.status}; });
        throw new Error(e.error||('HTTP '+r.status));
      }
      var data = await r.json();
      (data.jogos||[]).forEach(function(j){
        DADOS[j.data]=normalizar(j.atletas);
        EXTRAS[j.data]={ignorados:j.ignorados||[], periodos:j.periodos||[], auditoria:j.auditoria||null};
        ok++;
      });
      (data.falhas||[]).forEach(function(f){ falhas.push(f.data+' ('+f.motivo+')'); });
      CARREGADO = ok>0;
      render();
    }catch(err){
      falhas.push('lote '+(L+1)+': '+err.message);
      console.error('carregar:',err);
    }
    if(L<lotes.length-1) await esperar(PAUSA_MS);
  }

  setBotao(false);
  if(ok){
    salvarCache();
    setStatus(falhas.length?'err':'ok', ok+' jogos carregados'+(falhas.length?' · '+falhas.length+' sem dado':'')+
      ' · '+new Date().toLocaleString('pt-BR'));
  } else {
    setStatus('err','Nada carregado. '+(falhas[0]||'Verifique se /api/comparativo está publicado.'));
  }
  if(falhas.length) console.warn('Datas sem dado:',falhas);
  CARREGADO = ok>0;
  render();
}

function salvarCache(){
  if(DEMO) return;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({em:Date.now(), dados:DADOS, extras:EXTRAS})); }
  catch(e){ console.warn('cache:',e); }
}
function lerCache(){
  try{
    var raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    var o=JSON.parse(raw);
    if(o&&o.dados&&Object.keys(o.dados).length){
      DADOS=o.dados; EXTRAS=o.extras||{};
      Object.keys(DADOS).forEach(function(d){ DADOS[d]=normalizar(DADOS[d]); }); CARREGADO=true;
      setStatus('ok', Object.keys(DADOS).length+' jogos do cache · '+new Date(o.em).toLocaleString('pt-BR'));
      return true;
    }
  }catch(e){ console.warn('cache:',e); }
  return false;
}

// ============================================================================
// MODO DEMONSTRAÇÃO
// Números inventados, para conferir layout antes de o endpoint estar no ar.
// A faixa vermelha no topo fica visível o tempo todo — dado de exemplo nunca
// pode ser confundido com dado de jogo.
// ============================================================================
var DEMO=false;
var POS_DEMO=[['Zagueiros','ZAGUEIRO'],['Zagueiros','ZAGUEIRO'],['Zagueiros','ZAGUEIRO'],
  ['Laterais','LATERAL'],['Laterais','LATERAL'],['Meias','VOLANTE'],['Meias','VOLANTE'],
  ['Meias','MEIA'],['Meias','MEIA'],['Atacantes','EXTREMO'],['Atacantes','EXTREMO'],
  ['Atacantes','CENTROAVANTE'],['Atacantes','CENTROAVANTE'],['Laterais','LATERAL'],['Goleiros','GOLEIRO']];
var NOMES_DEMO=['ATLETA A','ATLETA B','ATLETA C','ATLETA D','ATLETA E','ATLETA F','ATLETA G','ATLETA H',
  'ATLETA I','ATLETA J','ATLETA K','ATLETA L','ATLETA M','ATLETA N','ATLETA O'];
function demo(){
  DEMO=true; DADOS={}; EXTRAS={}; SEM_POSICAO={};
  CONTEXTO.forEach(function(g,gi){
    var seed=(parseInt(g.data.split('/').join(''),10)+gi)%99991, r=function(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    var lst=[], n=14+Math.floor(r()*3);
    for(var k=0;k<n;k++){
      var pg=POS_DEMO[k%POS_DEMO.length], tit=k<11;
      var min = tit ? (r()<0.25 ? 55+r()*30 : 90+r()*5) : 8+r()*35;
      var dm = 101+r()*20, dist=min*dm;
      lst.push({id:900+k, nome:NOMES_DEMO[k%NOMES_DEMO.length], posicao:pg[1], grupo:pg[0],
        status:'ATIVO', ativo:true,
        min:+min.toFixed(1), t1Min:+(tit?Math.min(min,48):Math.max(0,min-20)).toFixed(1),
        t2Min:+Math.max(0,min-(tit?48:min-20)).toFixed(1),
        dist:Math.round(dist), altInt:Math.round(dist*(0.045+r()*0.03)), sprint:Math.round(dist*(0.008+r()*0.012)),
        acc:Math.round(min*(0.18+r()*0.12)), dec:Math.round(min*(0.25+r()*0.15)), pl:Math.round(min*(7+r()*2)),
        fmpRun:+(min*(0.16+r()*0.06)).toFixed(2), fmpDyn:+(min*(0.30+r()*0.08)).toFixed(2),
        hrMax:+(80+r()*15).toFixed(1), hrMed:+(70+r()*12).toFixed(1),
        expl:Math.round(r()*8), sprintEf:Math.round(r()*14),
        t1Dist:Math.round(dist*0.52), t2Dist:Math.round(dist*0.48),
        t1AltInt:Math.round(dist*0.03), t2AltInt:Math.round(dist*0.025)});
    }
    DADOS[g.data]=lst;
    var dTot=lst.reduce(function(t,a){ return t+a.dist; },0);
    var aud={dist:Math.round(dTot/0.996), accBand7plus:lst.reduce(function(t,a){return t+a.acc;},0)};
    var frac=[0.410,0.163,0.221,0.142,0.0455,0.0090,0.0005,0];
    for(var b=1;b<=8;b++) aud['vb'+b]=Math.round(aud.dist*frac[b-1]);
    var dec=lst.reduce(function(t,a){return t+a.dec;},0);
    aud.ab1=Math.round(dec*0.38); aud.ab2=Math.round(dec*0.62);
    aud.ab3=0; aud.ab4=0; aud.ab5=0; aud.ab6=0;
    aud.ab7=Math.round(aud.accBand7plus*0.72); aud.ab8=aud.accBand7plus-aud.ab7;
    EXTRAS[g.data]={ignorados:[],periodos:[],auditoria:aud};
  });
  CARREGADO=true;
  document.getElementById('demo-bar').style.display='block';
  setStatus('err','Modo exemplo — nenhum dado real da Catapult');
  render();
}

function montarAbas(){
  var t=document.getElementById('tabs');
  t.innerHTML=ABAS.map(function(a){
    return '<button class="tab'+(a.id===S.aba?' on':'')+'" role="tab" data-aba="'+a.id+'" '+
      'aria-selected="'+(a.id===S.aba)+'" aria-controls="p-'+a.id+'">'+esc(a.lab)+'</button>';
  }).join('');
  t.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){ trocarAba(b.dataset.aba); });
  });
}
function trocarAba(id){
  S.aba=id;
  document.querySelectorAll('.tab').forEach(function(b){
    var on=b.dataset.aba===id;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',on);
  });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('on', p.id==='p-'+id); });
  render();
}
function seg(id, chave){
  var c=document.getElementById(id);
  c.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      c.querySelectorAll('button').forEach(function(o){ o.classList.remove('on'); });
      b.classList.add('on'); S[chave]=b.dataset.v; render();
    });
  });
}

function render(){
  document.getElementById('hd-ant').textContent=LB_ANT;
  document.getElementById('hd-ant-mt').textContent=BLOCOS.anterior.jogos.length+' jogos · bloco de referência';
  document.getElementById('hd-nov').textContent=LB_NOVO;
  document.getElementById('hd-nov-mt').textContent=BLOCOS.novo.jogos.length+' jogos · bloco em análise';
  try{
    if(S.aba==='resumo') renderResumo();
    else if(S.aba==='equipe') renderEquipe();
    else if(S.aba==='posicao') renderPosicao();
    else if(S.aba==='individual') renderIndividual();
    else if(S.aba==='minutagem') renderMinutagem();
    else if(S.aba==='contexto') renderContexto();
    else if(S.aba==='auditoria') renderAuditoria();
    else if(S.aba==='metodo') renderMetodo();
  }catch(e){
    console.error('render '+S.aba+':',e);
    document.getElementById('p-'+S.aba).innerHTML=
      '<div class="card"><div class="empty"><strong>Erro ao desenhar esta aba</strong>'+esc(e.message)+
      '<br>Detalhe no console do navegador.</div></div>';
  }
  var painel=document.getElementById('p-'+S.aba);
  if(painel){
    painel.querySelectorAll('.sel-met').forEach(function(sm){
      sm.addEventListener('change',function(){ S.metricaFoco=sm.value; render(); });
    });
    var sm2=painel.querySelector('#seg-mat');
    if(sm2){
      sm2.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click',function(){ S.matriz=b.dataset.v; render(); });
      });
    }
  }
}

// ============================================================================
// TOOLTIP
// Um só elemento, delegado no documento. Qualquer coisa com data-tip mostra.
// ============================================================================
(function(){
  var tip=document.getElementById('tip'), alvo=null;
  function posicionar(e){
    var m=14, w=tip.offsetWidth, hh=tip.offsetHeight;
    var x=e.clientX+m, y=e.clientY+m;
    if(x+w>window.innerWidth-8) x=e.clientX-w-m;
    if(y+hh>window.innerHeight-8) y=e.clientY-hh-m;
    tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';
  }
  document.addEventListener('mouseover',function(e){
    var el=e.target.closest ? e.target.closest('[data-tip]') : null;
    if(!el){ return; }
    alvo=el; tip.innerHTML=el.getAttribute('data-tip');
    tip.classList.add('on'); tip.setAttribute('aria-hidden','false'); posicionar(e);
  });
  document.addEventListener('mousemove',function(e){ if(alvo) posicionar(e); });
  document.addEventListener('mouseout',function(e){
    var el=e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el===alvo){ alvo=null; tip.classList.remove('on'); tip.setAttribute('aria-hidden','true'); }
  });
  document.addEventListener('scroll',function(){
    if(alvo){ alvo=null; tip.classList.remove('on'); tip.setAttribute('aria-hidden','true'); }
  },true);
})();
