<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub de Projetos — Fortaleza E.C.</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --night:#071A3E; --blue:#003087; --red:#E8360A; --gold:#C4952A;
    --bg:#0b1f47; --card:#0f2a5c; --text:#f2f5fb; --muted:#a9b6d3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--night);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{
    text-align:center;padding:40px 16px 28px;
    background:repeating-linear-gradient(115deg,var(--night) 0 26px,#0a2350 26px 52px);
    border-bottom:4px solid var(--gold);
  }
  header img{height:84px;width:auto;margin-bottom:10px}
  h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:.3px}
  header p{margin:6px 0 0;color:var(--muted)}
  main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:28px 16px}
  .search{width:100%;padding:12px 14px;border-radius:6px;border:1px solid #23407f;background:var(--card);color:var(--text);font-size:1rem;margin-bottom:22px}
  .search::placeholder{color:var(--muted)}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin:26px 0 12px;border-bottom:1px solid #1d3a75;padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{
    display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:6px;
    background:var(--card);border:1px solid #1d3a75;border-top:3px solid var(--blue);
    color:inherit;text-decoration:none;transition:transform .15s,border-color .15s;
  }
  a.card:hover{transform:translateY(-3px);border-top-color:var(--red)}
  .card h3{margin:0;font-size:1.05rem}
  .card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4;flex:1}
  .open{font-weight:600;color:var(--gold);font-size:.9rem}
  .card.soon{opacity:.6;border-top-color:#3a4a6b;border-style:dashed}
  .card.soon .open{color:var(--muted)}
  .empty{color:var(--muted);display:none;text-align:center;padding:30px}
  footer{text-align:center;padding:20px 16px;color:var(--muted);font-size:.8rem;border-top:1px solid #1d3a75}
</style>
</head>
<body>
<header>
  <img src="escudo.png" alt="Fortaleza Esporte Clube" onerror="this.style.display='none'">
  <h1>Hub de Projetos</h1>
  <p>Departamento de Performance · Fortaleza Esporte Clube</p>
</header>

<main>
  <input class="search" id="q" type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto">
  <div id="content"></div>
  <p class="empty" id="empty">Nenhum projeto encontrado.</p>
</main>

<footer>Acesso restrito à comissão técnica. Os dados exibidos são de uso interno do clube.</footer>

<script>
/* ============================================================
   EDITE AQUI: para adicionar um projeto, copie uma linha e ajuste.
   - url: link do projeto. Deixe "" para mostrar "Em breve".
   - group: nome da seção onde o card aparece.
   ============================================================ */
const PROJECTS = [
  { group:"Treinamento", title:"Fichas de Treinamento",
    desc:"Ficha de treino por atleta e por programa, com geração de PDF e QR Code de vídeo em cada exercício.",
    url:"https://fec-sports-data.vercel.app/fichas/" },

  { group:"Jogos", title:"Relatório de Jogo",
    desc:"Relatório GPS pós-jogo com dados da Catapult: totais, por posição, acumulado, 1T/2T, fadiga, minutos e PSE.",
    url:"https://fec-backend-sigma.vercel.app/" },
  { group:"Jogos", title:"GPS 2D — Visualização Georreferenciada",
    desc:"Campo 2D, replay, mapa de calor, MDP, esforços e comparação entre jogos.",
    url:"https://fec-backend-sigma.vercel.app/gps2d.html" },
  { group:"Jogos", title:"Comparativo de Bloco de Jogos",
    desc:"Comparativo de blocos de jogos da temporada 2026 com tamanho de efeito.",
    url:"https://fec-comparativo-comissao.vercel.app/" },
  { group:"Jogos", title:"Minutagem 2026",
    desc:"Painel de minutos jogados por atleta na temporada 2026.",
    url:"https://minutagem-prov.vercel.app/" },

  { group:"Atletas", title:"Relatório Individual de Treino",
    desc:"Relatório individual por sessão e atleta, com métricas da Catapult.",
    url:"https://fec-backend-sigma.vercel.app/relatorio_treino_v3.html" },
  { group:"Atletas", title:"Meu Relatório de Treino",
    desc:"Versão do relatório de treino voltada ao atleta.",
    url:"https://fec-backend-sigma.vercel.app/meu_relatorio.html" },
];

const content = document.getElementById('content');
const empty = document.getElementById('empty');
const q = document.getElementById('q');

function render(filter=''){
  const f = filter.trim().toLowerCase();
  const list = PROJECTS.filter(p => (p.title+' '+p.desc+' '+p.group).toLowerCase().includes(f));
  const groups = {};
  list.forEach(p => (groups[p.group] = groups[p.group] || []).push(p));
  content.innerHTML = '';
  Object.entries(groups).forEach(([g, items]) => {
    const h = document.createElement('h2'); h.textContent = g;
    const grid = document.createElement('div'); grid.className = 'grid';
    items.forEach(p => {
      const live = !!p.url;
      const el = document.createElement(live ? 'a' : 'div');
      el.className = 'card' + (live ? '' : ' soon');
      if (live){ el.href = p.url; el.target = '_blank'; el.rel = 'noopener'; }
      el.innerHTML = '<h3></h3><p></p><span class="open"></span>';
      el.querySelector('h3').textContent = p.title;
      el.querySelector('p').textContent = p.desc;
      el.querySelector('.open').textContent = live ? 'Abrir →' : 'Em breve';
      grid.appendChild(el);
    });
    content.append(h, grid);
  });
  empty.style.display = list.length ? 'none' : 'block';
}
q.addEventListener('input', e => render(e.target.value));
render();
</script>
</body>
</html>
